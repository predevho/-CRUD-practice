spring:
  application:
    name: board

  datasource:
    url: jdbc:postgresql://localhost:5433/boarddb
    driver-class-name: org.postgresql.Driver
    username: board
    password: board1234

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
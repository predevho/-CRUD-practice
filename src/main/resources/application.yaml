spring:
  application:
    name: board

  datasource:
    url: jdbc:postgresql://localhost:5433/boarddb
    driver-class-name: org.postgresql.Driver
    username: board
    password: board1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        "[generate_statistics]": true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
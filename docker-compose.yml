services:
  postgres:
    image: postgres:16
    container_name: board-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: boarddb
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board1234
    volumes:
      - postgres-data:/var/lib/postgresql/data
  prometheus:
    image: prom/prometheus:latest
    container_name: board-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana:latest
    container_name: board-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: "dlagusgh7894@gmail.com"
      GF_SMTP_PASSWORD: "${GRAFANA_SMTP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "dlagusgh7894@gmail.com"
      GF_SMTP_FROM_NAME: "Board Grafana"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"

volumes:
  postgres-data:
  grafana-data: